<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>초등 워드마스터 베이직 Day28 Study More Words 2 (No.271-280)</title>
<style>
:root{
  --bg:#FFF8EC; --card:#fff; --ink:#2f2a25; --sub:#7a6f64; --line:#f0e3cf;
  --main:#FF8A3D; --main-d:#e5701f; --good:#3DBE6B; --bad:#E5645A;
  --c0:#FFD3D3; --c1:#CFE6FF; --c2:#D4F3C8; --c3:#FFEDB0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:12px 14px 130px;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center}
.ttl{font-size:19px;font-weight:800}
.hr{display:flex;gap:6px;align-items:center}
.snd{white-space:nowrap;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer}
.snd.off{background:#2f2a25;border-color:#2f2a25;color:#fff}
.ttl{white-space:nowrap}
.stars{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip,.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.tab{border-radius:12px;font-size:13px;padding:8px 2px;text-align:center;line-height:1.25;word-break:keep-all;min-height:46px}
.tab.on{background:#2f2a25;border-color:#2f2a25;color:#fff}
.prog{display:flex;gap:5px;justify-content:center;min-height:12px}
.prog i{width:26px;height:8px;border-radius:6px;background:var(--line)}
.prog i.done{background:var(--good)} .prog i.cur{background:var(--main)}
main{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 14px 20px;min-height:420px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.emo{font-size:72px;line-height:1.1}
.qhead{display:flex;flex-direction:column;align-items:center;gap:4px}
.ko{font-size:22px;font-weight:800}
.ask{font-size:14px;color:var(--sub);font-weight:600}
.btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn:active{transform:scale(.96)}
.btn.pulse{background:#fff3dc;border-color:#FF8A3D;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.btn.small{padding:6px 12px;font-size:13px}
.btn.primary{background:var(--main);border-color:var(--main-d);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.row.nav{gap:12px;margin-top:6px}
.row.nav .btn.big{margin-top:0}
.btn.big{font-size:18px;padding:13px 30px;margin-top:6px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bigword{font-size:46px;font-weight:800;letter-spacing:1px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:64px}
.ck{display:inline-block;padding:2px 12px 6px;border-radius:14px;line-height:1.15}
.ck.c0{background:var(--c0)} .ck.c1{background:var(--c1)} .ck.c2{background:var(--c2)} .ck.c3{background:var(--c3)}
.ck.whole{background:#f4ece0}
.ck.blank{background:#fff;border:3px dashed var(--main);color:var(--main);min-width:70px}
.ck.blank.filled{border:0;color:var(--ink)}
.sentbox{width:100%;background:#fffaf0;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.sentbox .en{font-size:21px;font-weight:700} .sentbox .en b{color:var(--main-d)}
.sentbox .skor{font-size:14px;color:var(--sub)}
.gap{display:inline-block;min-width:78px;border-bottom:4px solid var(--main);margin:0 4px;color:var(--main-d);font-weight:800}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opts.row3{flex-direction:row;justify-content:center}
.opt{border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px;font-size:32px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink);letter-spacing:1px}
.opts.row3 .opt{flex:1;max-width:120px}
.opt.good{background:#d8f7e2;border-color:var(--good)}
.opt.bad{background:#fde1de;border-color:var(--bad);color:#b9a7a5;opacity:.7}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.slot{min-width:48px;height:58px;padding:0 8px;border-radius:12px;border:3px dashed #d9c9b0;background:#fffdf8;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;cursor:pointer}
.slot.sp{margin-left:10px}
.slot.c0{border-color:#f2a3a3;background:var(--c0)} .slot.c1{border-color:#93c4f5;background:var(--c1)}
.slot.c2{border-color:#9fdc8c;background:var(--c2)} .slot.c3{border-color:#f0cf62;background:var(--c3)}
.slot.filled{border-style:solid;border-color:#cdb895;background:#fff3dc}
.slot.c0.filled{border-color:#e58a8a;background:var(--c0)} .slot.c1.filled{border-color:#6fa9e8;background:var(--c1)}
.slot.c2.filled{border-color:#7ccb66;background:var(--c2)} .slot.c3.filled{border-color:#e3bb3f;background:var(--c3)}
.slots.ok .slot{border-color:var(--good);background:#d8f7e2;animation:pop .45s}
.pool{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.tile{min-width:54px;height:60px;padding:0 10px;border-radius:14px;border:2px solid #e4d3b6;border-bottom-width:5px;background:#fff;font-size:30px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink)}
.tile:active{transform:translateY(2px)}
.tile.used{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.fin{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:20px}
.fin .big{font-size:70px}
.fin h2{margin:0;font-size:24px}
.hard{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hard span{background:var(--c3);border-radius:999px;padding:4px 12px;font-weight:700}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#2f2a25;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)} #toast.good{background:var(--good)}
.rvnote{grid-column:1/-1;background:#fff3dc;border:2px dashed #f0cf8f;border-radius:12px;padding:9px 10px;font-size:13px;font-weight:700;color:#8a6a2a;text-align:center;line-height:1.5}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;margin-top:4px}
.kr{display:flex;gap:4px;justify-content:center;width:100%}
.key{flex:1;max-width:38px;height:46px;border-radius:9px;border:2px solid #e4d3b6;border-bottom-width:4px;background:#fff;font-size:19px;font-weight:800;font-family:inherit;cursor:pointer;color:var(--ink);padding:0}
.key:active{transform:translateY(2px)}
.key.bad{background:#fde1de;border-color:var(--bad)} .key.good{background:#d8f7e2;border-color:var(--good)}
.fabs{position:fixed;right:14px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:8}
.fab{display:none;width:56px;height:58px;border-radius:14px;border:2px solid #fff;background:#3b4a94;color:#fff;box-shadow:0 3px 10px rgba(30,40,100,.35);flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;font-family:inherit;padding:0}
.fab.show{display:flex}
.fab b{font-size:24px;line-height:1;font-weight:800}
.fab span{font-size:11px;font-weight:800;letter-spacing:.5px;line-height:1.1;margin-top:2px}
.foot{font-size:11px;color:#b3a695;text-align:center;line-height:2}
.foot .home{color:#7a6f64;font-weight:700;margin:0 6px}
.back{text-decoration:none;white-space:nowrap;font-weight:800;padding:5px 10px;font-size:12px}
.hr{flex-wrap:nowrap}.snd{padding:5px 8px;font-size:12px}
.sub{font-size:12px;color:var(--sub);font-weight:700;margin-top:-4px}
</style>
</head>
<body>
<div id="app">
  <header><div class="ttl">🔤 스펠링 놀이터</div><div class="hr"><button class="snd" id="snd" onclick="toggleSound()" aria-label="소리 켜기/끄기">🔊 소리 켜짐</button><div class="stars" id="stars">⭐ 0</div></div></header>
  <div class="sub" id="sub"></div>
  <div class="chips" id="chips"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="prog" id="prog"></div>
  <main id="stage"></main>
  <div class="foot" id="foot"></div>
</div>
<div class="fabs"><button class="fab" id="goTop" aria-label="맨 위로"><b>↑</b><span>TOP</span></button></div>
<div id="toast"></div>

<script>
/* ========== 설정 ========== */
// 음원(mp3) 저장소 주소. 비워 두면 브라우저 기계음(TTS)으로 임시 재생.
// 나중에: 'https://miracleenglish.github.io/○○○-audio/'  (파일명: boat.mp3 / boat_s.mp3)
const AUDIO_BASE = 'https://miracleenglish.github.io/voca-audio-elementary/audio/';
const DATA = {"study": "학습_28.초등 워드마스터 베이직 Day28 Study More Words 2 (No.271-280).html", "title": "초등 워드마스터 베이직 Day28 Study More Words 2 (No.271-280)", "sets": {"A": ["cut", "run", "make", "do", "name"], "B": ["age", "deep", "hard", "bottle", "begin"]}, "words": {"cut": {"ko": "자르다", "emoji": "✂️", "chunks": ["c", "u", "t"], "key": 1, "dist": ["o", "a"], "wrong": ["cutt", "cutte"], "sent": "I cut the paper.", "sentKo": "나는 종이를 잘라요.", "af": "e1028_w1", "kf": "e1028_w1_ko", "sf": "e1028_s1"}, "run": {"ko": "뛰다, 달리다", "emoji": "🏃", "chunks": ["r", "u", "n"], "key": 1, "dist": ["o", "a"], "wrong": ["runn", "rnu"], "sent": "I can run fast.", "sentKo": "나는 빨리 달릴 수 있어요.", "af": "e1028_w2", "kf": "e1028_w2_ko", "sf": "e1028_s2"}, "make": {"ko": "만들다", "emoji": "🛠️", "chunks": ["m", "a", "ke"], "key": 1, "dist": ["ai", "ay"], "wrong": ["maik", "makk"], "sent": "I make a cake.", "sentKo": "나는 케이크를 만들어요.", "af": "e1028_w3", "kf": "e1028_w3_ko", "sf": "e1028_s3"}, "do": {"ko": "하다", "emoji": "✅", "chunks": ["d", "o"], "key": 1, "dist": ["oo", "ou"], "wrong": ["dooh", "dhu"], "sent": "I do my homework.", "sentKo": "나는 숙제를 해요.", "af": "e1028_w4", "kf": "e1028_w4_ko", "sf": "e1028_s4"}, "name": {"ko": "이름", "emoji": "🏷️", "chunks": ["n", "a", "me"], "key": 1, "dist": ["ai", "ay"], "wrong": ["naim", "namm"], "sent": "My name is Mia.", "sentKo": "내 이름은 미아예요.", "af": "e1028_w5", "kf": "e1028_w5_ko", "sf": "e1028_s5"}, "age": {"ko": "나이", "emoji": "🎂", "chunks": ["a", "ge"], "key": 1, "dist": ["je", "dge"], "wrong": ["aje", "aige"], "sent": "What is your age?", "sentKo": "네 나이는 몇 살이에요?", "af": "e1028_w6", "kf": "e1028_w6_ko", "sf": "e1028_s6"}, "deep": {"ko": "깊은", "emoji": "🕳️", "chunks": ["d", "ee", "p"], "key": 1, "dist": ["ea", "ie"], "wrong": ["deap", "deeep"], "sent": "The sea is deep.", "sentKo": "바다는 깊어요.", "af": "e1028_w7", "kf": "e1028_w7_ko", "sf": "e1028_s7"}, "hard": {"ko": "열심히 / 단단한", "emoji": "💪", "chunks": ["h", "ar", "d"], "key": 1, "dist": ["or", "er"], "wrong": ["harde", "hardd"], "sent": "I study hard.", "sentKo": "나는 열심히 공부해요.", "af": "e1028_w8", "kf": "e1028_w8_ko", "sf": "e1028_s8"}, "bottle": {"ko": "병", "emoji": "🍼", "chunks": ["b", "o", "tt", "le"], "key": 2, "dist": ["t", "dd"], "wrong": ["botle", "bottel"], "sent": "I have a water bottle.", "sentKo": "나는 물병이 하나 있어요.", "af": "e1028_w9", "kf": "e1028_w9_ko", "sf": "e1028_s9"}, "begin": {"ko": "시작하다", "emoji": "🚦", "chunks": ["b", "e", "g", "i", "n"], "key": 1, "dist": ["ea", "i"], "wrong": ["bigin", "beggin"], "sent": "We begin now.", "sentKo": "우리는 이제 시작해요.", "af": "e1028_w10", "kf": "e1028_w10_ko", "sf": "e1028_s10"}}};

/* ========== 데이터 ========== */
const W = DATA.words;
document.title = DATA.title;
const SETS = {A: DATA.sets.A, B: DATA.sets.B, ALL: [...DATA.sets.A, ...DATA.sets.B], REVIEW: [...DATA.sets.A, ...DATA.sets.B]};
const SET_LABEL = {A:'A조 (5개)', B:'B조 (5개)', ALL:'10개 섞기', REVIEW:'🔁 3일차 복습'};
const REVIEW_POOL = ['spot','miss','tile','sent','type'];
/* 게임 추가는 이 배열에 함수 하나만 등록하면 됨 (데이터 변경 없음) */
const GAMES = [
  {id:'card',  name:'① 익히기',      run:gCard},
  {id:'chunk', name:'② 쪼개 만들기', run:gChunk},
  {id:'spot',  name:'③ 맞는 철자',   run:gSpot},
  {id:'miss',  name:'④ 빠진 글자',   run:gMiss},
  {id:'tile',  name:'⑤ 글자 조립',   run:gTile},
  {id:'sent',  name:'⑥ 문장 완성',   run:gSent},
  {id:'type',  name:'⑦ 타이핑',      run:gType}
];

/* ========== 상태 ========== */
const S = {gmap:{}, mute:false, set:'A', game:'card', q:[], i:0, got:0, hard:[], requeued:new Set()};
let total = 0;
try { total = +localStorage.getItem('spellTotal') || 0; } catch(e){}
const $ = s => document.querySelector(s);
const LET = w => W[w].chunks.join('');   // 철자 글자열(띄어쓰기 제외)
const stage = $('#stage');

/* ========== 유틸 ========== */
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function shuffleDiff(a){ let r=shuffle(a); for(let k=0;k<12 && r.join('|')===a.join('|') && new Set(a).size>1;k++) r=shuffle(a); return r; }
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function ckHTML(w){ return W[w].chunks.map((c,i)=>`<span class="ck c${i%4}">${c}</span>`).join(''); }
function toast(msg, good){ const t=$('#toast'); t.textContent=msg; t.className='on'+(good?' good':''); clearTimeout(toast.h); toast.h=setTimeout(()=>t.className='',1400); }
function initMeta(){ $('#sub').textContent=DATA.title;
  if(/from=study/.test(location.search) && DATA.study){ const a=document.createElement('a'); a.className='btn small back'; a.href=encodeURIComponent(DATA.study); a.textContent='📖 학습'; $('.hr').prepend(a); } const f=$('#foot'); f.innerHTML=DATA.title+' <a class="home" href="index.html">🏠 목록</a> <button class="btn small" onclick="soundTest()">🔊 소리 테스트</button>'; }
function updateStars(){ $('#stars').textContent='⭐ '+total; }

/* ========== 소리 ========== */
let soundOn=true;   // 앱을 열 때마다 항상 켜진 상태로 시작
function paintSound(){ const b=document.getElementById('snd'); if(!b) return; b.textContent = soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐'; b.classList.toggle('off',!soundOn); }
function toggleSound(){
  soundOn=!soundOn;
  if(!soundOn) stopAll();
  paintSound(); toast(soundOn?'소리를 켰어요 🔊':'소리를 껐어요 🔇 (글자 연습은 그대로 할 수 있어요)');
}
let curAudio=null, ac=null, voices=[], lastU=null;
function loadVoices(){ try{ voices=speechSynthesis.getVoices()||[]; }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function stopAll(sp=true){ try{ if(curAudio){curAudio.pause();curAudio=null;} if(sp) speechSynthesis.cancel(); }catch(e){} }
function tts(text){
  if(!('speechSynthesis' in window)){ toast('이 브라우저는 소리를 지원하지 않아요 😢'); return; }
  try{
    const ss=speechSynthesis, busy=ss.speaking||ss.pending;
    if(busy) ss.cancel();
    if(ss.paused) ss.resume();
    const u=new SpeechSynthesisUtterance(text); lastU=u; u.lang='en-US'; u.rate=0.8; u.volume=1;
    const v=voices.find(v=>/en[-_]US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(v) u.voice=v;
    u.onerror=e=>{ if(e.error && !/canceled|interrupted/.test(e.error)) toast('소리 오류: '+e.error); };
    setTimeout(()=>ss.speak(u), busy?150:0);
  }catch(e){ toast('소리를 낼 수 없어요 😢'); }
}
function say(text, file){
  if(!soundOn){ toast('소리가 꺼져 있어요 🔇 위의 버튼으로 켤 수 있어요'); return; }
  if(AUDIO_BASE){
    stopAll();
    let fell=false; const fb=()=>{ if(!fell){fell=true; tts(text);} };
    const a=new Audio(AUDIO_BASE+file+'.mp3'); curAudio=a; a.onerror=fb;
    a.play().catch(fb);
  } else { stopAll(false); tts(text); }
}
const sayWord = w => say(w, W[w].af);
const saySent = w => say(W[w].sent, W[w].sf);
function soundTest(){
  if(!soundOn){ toast('소리가 꺼져 있어요 🔇 위의 버튼으로 켠 뒤 눌러 주세요'); return; }
  loadVoices();
  const en=voices.filter(v=>/^en/i.test(v.lang)).length;
  toast('음성 '+voices.length+'개 / 영어 '+en+'개 — 소리가 나는지 확인해요');
  tts('Hello! Can you hear me?');
}
// 첫 터치 때 기기의 소리 잠금 해제(iOS/안드로이드)
document.addEventListener('pointerdown',()=>{ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} },{once:true});
function sfx(ok){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime;
    (ok?[660,880]:[220]).forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.15,t+i*.12); g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.25);
      o.connect(g); g.connect(ac.destination); o.start(t+i*.12); o.stop(t+i*.12+.26);
    });
  }catch(e){}
}

/* ========== 라운드 진행 ========== */
function buildNav(){
  $('#chips').innerHTML=''; $('#tabs').innerHTML='';
  Object.keys(SETS).forEach(k=>{ const b=el('button','chip'+(S.set===k?' on':''),SET_LABEL[k]); b.onclick=()=>{S.set=k; S.game=(k==='REVIEW'?'review':'card'); buildNav(); startRound(true);}; $('#chips').appendChild(b); });
  if(S.set==='REVIEW'){ $('#tabs').appendChild(el('div','rvnote','🔁 10개를 섞어서 5가지 게임이 번갈아 나와요<br>막히면 💡 힌트를 눌러도 괜찮아요!')); return; }
  GAMES.forEach(g=>{ const b=el('button','tab'+(S.game===g.id?' on':''),g.name); b.onclick=()=>{S.game=g.id; buildNav(); startRound(true);}; $('#tabs').appendChild(b); });
}
function startRound(quiet=false, doShuffle=false){
  stopAll();
  S.mute = quiet;   // 탭/조를 눌러 이동한 직후 첫 화면에서는 자동 재생 안 함
  if(S.set==='REVIEW'){
    S.game='review';
    S.q=shuffle(SETS.REVIEW);
    const gm=[...shuffle(REVIEW_POOL),...shuffle(REVIEW_POOL)]; S.gmap={}; S.q.forEach((w,i)=>S.gmap[w]=gm[i]);
  } else S.q = (S.game==='card' || !doShuffle) ? [...SETS[S.set]] : shuffle(SETS[S.set]);
  S.i=0; S.got=0; S.hard=[]; S.requeued=new Set();
  show();
}
function renderProg(){
  const p=$('#prog'); p.innerHTML='';
  S.q.forEach((_,k)=>p.appendChild(el('i', k<S.i?'done':(k===S.i?'cur':''))));
}
function show(){
  if(S.i>=S.q.length) return finish();
  stage.innerHTML=''; renderProg(); document.onkeydown=null; fails=0;
  const w=S.q[S.i], g=GAMES.find(x=>x.id===(S.game==='review'?S.gmap[w]:S.game));
  g.run(w, stage);
}
function next(){ S.i++; S.mute=false; show(); }
function correct(){ sfx(true); toast('참 잘했어요! ⭐', true); S.got++; total++; try{localStorage.setItem('spellTotal',total);}catch(e){} updateStars(); setTimeout(next,1200); }
let fails=0;
function wrong(w){
  fails++;
  const hb=document.querySelectorAll('.hintbtn');
  if(fails>=2 && hb.length){ hb.forEach(b=>b.classList.add('pulse')); sfx(false); toast('막히면 💡 힌트를 눌러 봐요!'); }
  else { sfx(false); toast('괜찮아요, 다시 해 봐요! 💪'); }
  if(!S.requeued.has(w)){ S.requeued.add(w); S.q.push(w); renderProg(); }
  if(!S.hard.includes(w)) S.hard.push(w);
}
function finish(){
  $('#prog').innerHTML=''; stage.innerHTML='';
  const isCard=S.game==='card';
  const d=el('div','fin');
  d.innerHTML = isCard
    ? `<div class="big">👀</div><h2>다 봤어요!</h2><div class="ask">이제 게임으로 해 볼까요?</div>`
    : `<div class="big">🎉</div><h2>별 ${S.got}개 모았어요!</h2>` +
      (S.hard.length ? `<div class="ask">한 번 더 연습한 단어</div><div class="hard">${S.hard.map(w=>`<span>${w}</span>`).join('')}</div>` : `<div class="ask">한 번도 안 틀렸어요! 대단해요 👏</div>`);
  const row=el('div','row');
  const again=el('button','btn','🔁 한 번 더'); again.onclick=()=>startRound(false,true); row.appendChild(again);
  const gi=GAMES.findIndex(x=>x.id===S.game);
  if(gi>=0 && gi<GAMES.length-1){ const nx=el('button','btn primary','다음 게임 ▶'); nx.onclick=()=>{S.game=GAMES[gi+1].id; buildNav(); startRound(true);}; row.appendChild(nx); }
  d.appendChild(row); stage.appendChild(d);
  if(!isCard) sfx(true);
}

/* ========== 공통 부품 ========== */
function qhead(w, opt={}){
  const d=W[w];
  return `<div class="qhead"><div class="emo">${d.emoji}</div><div class="ko">${d.ko}</div>
    <div class="row"><button class="btn small" data-spk="w">🔊 단어</button>${opt.sent?'<button class="btn small" data-spk="s">🔊 문장</button>':''}</div></div>`;
}
function bindSpk(host,w){
  host.querySelectorAll('[data-spk]').forEach(b=>b.onclick=()=>b.dataset.spk==='s'?saySent(w):sayWord(w));
}
function autoSay(w, sent){ if(S.mute || !soundOn) return; setTimeout(()=>sent?saySent(w):sayWord(w), 300); }

/* 블록/글자 조립 엔진: units(조각 배열)를 눌러서 순서대로 채움 */
function assemble(host, w, units, opt={}){
  const ans=units.join(''), pool=shuffleDiff(units), placed=Array(units.length).fill(-1);
  let lock=false;
  const slotsEl=el('div','slots'), poolEl=el('div','pool'), bar=el('div','row');
  const hint=el('button','btn small hintbtn','💡 힌트'); if(!opt.noHint) bar.appendChild(hint);
  host.appendChild(slotsEl); host.appendChild(poolEl); host.appendChild(bar);

  function draw(){
    slotsEl.innerHTML=''; poolEl.innerHTML='';
    placed.forEach((j,i)=>{
      const s=el('div','slot'+(opt.cls&&opt.cls[i]?' '+opt.cls[i]:'')+(opt.gap&&opt.gap[i]?' sp':'')+(j>=0?' filled':''), j>=0?pool[j]:'');
      s.onclick=()=>{ if(lock||j<0) return; placed[i]=-1; draw(); };
      slotsEl.appendChild(s);
    });
    pool.forEach((u,j)=>{
      const t=el('button','tile'+(placed.includes(j)?' used':''),u);
      t.onclick=()=>{ if(lock) return; const k=placed.indexOf(-1); if(k<0) return; placed[k]=j; draw(); if(placed.indexOf(-1)<0) check(); };
      poolEl.appendChild(t);
    });
  }
  function check(){
    lock=true;
    const got=placed.map(j=>pool[j]).join('');
    if(got===ans){ slotsEl.classList.add('ok'); sayWord(w); opt.onOk&&opt.onOk(); correct(); }
    else {
      slotsEl.classList.add('shake'); wrong(w);
      setTimeout(()=>{ slotsEl.classList.remove('shake'); placed.fill(-1); lock=false; draw(); },800);
    }
  }
  hint.onclick=()=>{
    if(lock) return;
    let i=0; while(i<units.length && placed[i]>=0 && pool[placed[i]]===units[i]) i++;
    for(let k=i;k<units.length;k++) placed[k]=-1;
    const j=pool.findIndex((u,idx)=>u===units[i] && !placed.includes(idx));
    if(j>=0){ placed[i]=j; draw(); if(placed.indexOf(-1)<0) check(); }
  };
  draw();
}

/* ========== 게임 6가지 ========== */
function gCard(w, host){
  const d=W[w]; let split=true;
  const sentHL=d.sent.replace(new RegExp('\\b'+w+'\\b','i'), m=>`<b>${m}</b>`);
  host.innerHTML=`<div class="emo">${d.emoji}</div><div class="bigword" id="bw"></div><div class="ko">${d.ko}</div>
    <div class="row"><button class="btn" id="b1">🔊 단어 듣기</button><button class="btn" id="b2">✂️ 합쳐 보기</button></div>
    <div class="sentbox"><div class="en">${sentHL}</div><div class="skor">${d.sentKo}</div><button class="btn small" id="b3">🔊 문장 듣기</button></div>
    <div class="row nav"><button class="btn big" id="pv"${S.i===0?' disabled':''}>◀ 이전</button><button class="btn primary big" id="nx">${S.i===S.q.length-1?'끝! ✔':'다음 ▶'}</button></div>`;
  const bw=host.querySelector('#bw');
  const draw=()=>{ bw.innerHTML = split ? ckHTML(w) : `<span class="ck whole">${w}</span>`; host.querySelector('#b2').textContent = split?'🔗 합쳐 보기':'✂️ 쪼개 보기'; };
  bw.onclick=()=>sayWord(w);
  host.querySelector('#b1').onclick=()=>sayWord(w);
  host.querySelector('#b2').onclick=()=>{ split=!split; draw(); };
  host.querySelector('#b3').onclick=()=>saySent(w);
  host.querySelector('#nx').onclick=next;
  host.querySelector('#pv').onclick=()=>{ if(S.i>0){ S.i--; S.mute=true; show(); } };
  draw(); autoSay(w);
}

function gChunk(w, host){
  const d=W[w];
  host.innerHTML=qhead(w)+`<div class="ask">위 단어를 보고 똑같이 블록을 맞춰요</div><div class="bigword">${ckHTML(w)}</div>`;
  bindSpk(host,w); assemble(host,w,d.chunks); autoSay(w);
}

function gSpot(w, host){
  const d=W[w];
  host.innerHTML=qhead(w)+`<div class="ask">맞는 철자를 골라요</div><div class="opts"></div>`;
  bindSpk(host,w); autoSay(w);
  const box=host.querySelector('.opts'); let done=false;
  shuffle([w,...d.wrong]).forEach(o=>{
    const b=el('button','opt',o);
    b.onclick=()=>{
      if(done||b.classList.contains('bad')) return;
      if(o===w){ done=true; b.classList.add('good'); sayWord(w); correct(); }
      else { b.classList.add('bad','shake'); wrong(w); }
    };
    box.appendChild(b);
  });
}

function gMiss(w, host){
  const d=W[w];
  host.innerHTML=qhead(w)+`<div class="ask">빠진 글자를 골라요</div><div class="bigword" id="bw"></div><div class="opts row3"></div>`;
  bindSpk(host,w); autoSay(w);
  const bw=host.querySelector('#bw');
  bw.innerHTML=d.chunks.map((c,i)=> i===d.key ? `<span class="ck blank" id="bl">?</span>` : `<span class="ck c${i%4}">${c}</span>`).join('');
  const bl=bw.querySelector('#bl'), right=d.chunks[d.key]; let done=false;
  shuffle([right,...d.dist]).forEach(o=>{
    const b=el('button','opt',o);
    b.onclick=()=>{
      if(done||b.classList.contains('bad')) return;
      if(o===right){ done=true; b.classList.add('good'); bl.textContent=o; bl.classList.add('filled','c'+(d.key%4)); sayWord(w); correct(); }
      else { b.classList.add('bad','shake'); wrong(w); }
    };
    host.querySelector('.opts').appendChild(b);
  });
}

function gTile(w, host){
  const d=W[w], cls=[], gap=[];
  d.chunks.forEach((c,ci)=>[...c].forEach((_,k)=>{ cls.push('c'+(ci%4)); gap.push(ci>0&&k===0); }));
  host.innerHTML=qhead(w)+`<div class="ask">소리를 듣고 글자를 눌러 단어를 만들어요<br>(색깔 칸 = 소리 덩어리)</div>`;
  bindSpk(host,w); assemble(host,w,[...LET(w)],{cls,gap}); autoSay(w);
}

function gSent(w, host){
  const d=W[w];
  const blank=d.sent.replace(new RegExp('\\b'+w+'\\b','i'),'<span class="gap" id="gp">&nbsp;</span>');
  host.innerHTML=qhead(w,{sent:true})+`<div class="sentbox"><div class="en">${blank}</div><div class="skor">${d.sentKo}</div></div><div class="ask">빈칸에 들어갈 단어를 만들어요</div>`;
  bindSpk(host,w);
  assemble(host,w,[...LET(w)],{onOk:()=>{ const g=host.querySelector('#gp'); if(g) g.textContent=w; }});
  autoSay(w);
}

function gType(w, host){
  const d=W[w]; let pos=0, lock=false;
  host.innerHTML=qhead(w,{sent:true})+`<div class="ask">소리를 듣고 키보드로 한 글자씩 눌러요<br>(틀린 글자는 들어가지 않아요)</div><div class="slots" id="ts"></div><div class="kb" id="kb"></div><div class="row"><button class="btn small hintbtn" id="th">💡 힌트</button></div>`;
  bindSpk(host,w);
  const ts=host.querySelector('#ts'), kb=host.querySelector('#kb');
  const L=LET(w); [...L].forEach(()=>ts.appendChild(el('div','slot','')));
  const keys={};
  ['qwertyuiop','asdfghjkl','zxcvbnm'].forEach(r=>{
    const row=el('div','kr');
    [...r].forEach(c=>{ const k=el('button','key',c); k.onclick=()=>press(c); keys[c]=k; row.appendChild(k); });
    kb.appendChild(row);
  });
  function flash(c,cls){ const k=keys[c]; if(!k) return; k.classList.add(cls); setTimeout(()=>k.classList.remove(cls),350); }
  function press(c){
    if(lock) return;
    if(c===L[pos].toLowerCase()){
      const sl=ts.children[pos]; sl.textContent=L[pos]; sl.classList.add('filled'); flash(c,'good'); pos++;
      if(pos===L.length){ lock=true; ts.classList.add('ok'); sayWord(w); correct(); }
    } else { flash(c,'bad'); ts.classList.add('shake'); setTimeout(()=>ts.classList.remove('shake'),400); wrong(w); }
  }
  const th=host.querySelector('#th'); if(th) th.onclick=()=>{ if(!lock) press(L[pos].toLowerCase()); };
  document.onkeydown=e=>{ if(/^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey) press(e.key.toLowerCase()); };
  autoSay(w);
}

/* 맨 위/맨 아래 버튼 */
function fabUpdate(){
  document.getElementById('goTop').classList.toggle('show', window.scrollY>60);
}
document.getElementById('goTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
addEventListener('scroll',fabUpdate,{passive:true}); addEventListener('resize',fabUpdate); fabUpdate();
new MutationObserver(fabUpdate).observe(document.getElementById('stage'),{childList:true,subtree:true});

/* ========== 시작 ========== */
initMeta(); updateStars(); paintSound(); buildNav(); startRound(true);
if('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
